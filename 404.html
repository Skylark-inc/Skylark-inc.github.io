<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">

  <title>Page Not Found — Skylark</title>

  <!-- Absolute URLs so nested 404 paths cannot break them -->
  <link
    rel="icon"
    href="https://skylark-inc.github.io/0019A648-6056-4C45-B1F3-145DB1BBA696.png"
  >
  <link
    rel="apple-touch-icon"
    href="https://skylark-inc.github.io/0019A648-6056-4C45-B1F3-145DB1BBA696.png"
  >

  <style>
    :root {
      color-scheme: light dark;

      --background-top: #fff9dc;
      --background-middle: #eef4f5;
      --background-bottom: #eef2fa;

      --text: #1d1d1f;
      --secondary: #6e6e73;

      --accent: #b87800;
      --button-background: rgba(255, 255, 255, 0.72);
      --button-border: rgba(0, 0, 0, 0.08);
      --button-shadow: rgba(0, 0, 0, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100svh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          160deg,
          var(--background-top) 0%,
          var(--background-middle) 40%,
          var(--background-bottom) 100%
        );

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      min-height: 100svh;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      padding:
        max(40px, env(safe-area-inset-top))
        max(26px, env(safe-area-inset-right))
        max(40px, env(safe-area-inset-bottom))
        max(26px, env(safe-area-inset-left));
    }

    .content {
      width: 100%;
      max-width: 720px;
      padding-top: clamp(10px, 6vh, 70px);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .logo {
      display: block;

      width: clamp(110px, 25vw, 145px);
      height: clamp(110px, 25vw, 145px);

      border-radius: 28%;
      object-fit: cover;

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.10);
    }

    .eyebrow {
      margin: 0 0 20px;

      color: var(--accent);

      font-size: 17px;
      font-weight: 750;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0;

      font-size: clamp(42px, 8vw, 64px);
      line-height: 1.03;
      letter-spacing: -0.045em;
      font-weight: 750;
    }

    .description {
      max-width: 650px;

      margin: 32px 0 0;

      color: var(--secondary);

      font-size: clamp(19px, 4.5vw, 25px);
      line-height: 1.5;
      letter-spacing: -0.015em;
    }

    .actions {
      margin-top: 30px;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 50px;

      padding: 0 22px;

      border: 1px solid var(--button-border);
      border-radius: 980px;

      background: var(--button-background);
      color: var(--text);

      box-shadow:
        0 8px 25px var(--button-shadow);

      font-size: 17px;
      font-weight: 600;
      text-decoration: none;

      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);

      transition:
        transform 0.16s ease,
        background 0.16s ease;
    }

    .home-button:active {
      transform: scale(0.97);
    }

    @media (hover: hover) {
      .home-button:hover {
        background: rgba(255, 255, 255, 0.9);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background-top: #211d10;
        --background-middle: #17191c;
        --background-bottom: #111318;

        --text: #f5f5f7;
        --secondary: #a1a1a6;

        --accent: #ffc342;

        --button-background: rgba(45, 45, 48, 0.72);
        --button-border: rgba(255, 255, 255, 0.10);
        --button-shadow: rgba(0, 0, 0, 0.20);
      }

      @media (hover: hover) {
        .home-button:hover {
          background: rgba(60, 60, 64, 0.9);
        }
      }
    }

    @media (max-width: 500px) {
      .page {
        padding-left: 26px;
        padding-right: 26px;
      }

      .content {
        padding-top: 0;
      }

      .logo-wrap {
        margin-bottom: 28px;
      }

      .description {
        margin-top: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .home-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content">

      <div class="logo-wrap">
        <img
          class="logo"
          src="https://skylark-inc.github.io/0019A648-6056-4C45-B1F3-145DB1BBA696.png"
          alt="Skylark"
        >
      </div>

      <p class="eyebrow">404</p>

      <h1>Page Not Found</h1>

      <p class="description">
        This page was either moved, never existed, or flew into the wrong folder.
      </p>

      <div class="actions">
        <a
          class="home-button"
          href="https://skylark-inc.github.io/"
        >
          Return Home
        </a>
      </div>

    </section>
  </main>
</body>
</html>
